plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'io.hxneyw'

base {
    archivesName = 'create-bitterballen-villager-breeding-compatibility-1.20.1-forge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                bitterballen_villager_compat {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    runtimeOnly fg.deobf('curse.maven:create-328085:6641603')
    runtimeOnly fg.deobf('maven.modrinth:16DuAG4k:OwyfY4ZL')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Create: Bitterballen - Villager Breeding Compatibility',
            'Specification-Vendor': 'Hxney',
            'Specification-Version': '1',
            'Implementation-Title': 'Create: Bitterballen - Villager Breeding Compatibility',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Hxney'
        ])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

tasks.named('sourcesJar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'create-bitterballen-villager-breeding-compatibility-1.20.1-forge'
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        maven {
            name = 'localRelease'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
